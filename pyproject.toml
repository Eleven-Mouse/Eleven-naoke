[project]
name = "eleven-naoke"
version = "0.1.0"
description = "个人本地 RAG 知识库：Markdown 载体 + 全离线语义检索 + MCP 集成"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "fastembed>=0.4",
    "sentence-transformers>=3.3",
    "lancedb>=0.15",
    "pyarrow>=17",
    "mcp>=1.2",
    "pyyaml>=6",
]

[project.scripts]
kb = "pkb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
